services:
  lawyer-api:
    build:
      context: ../..
      dockerfile: infra/applications/Dockerfile.service
      args:
        SERVICE_MODULE: services.lawyer.main:app
    container_name: gestao_de_negocios_lawyer_api
    ports:
      - "8002:8000"
    environment:
      - IN_DOCKER=true
      - DB_HOST=gestao_de_negocios_postgres
      - SERVICE_TYPE=lawyer
    env_file:
      - ../../.env
    networks:
      - gestao_de_negocios_network

networks:
  gestao_de_negocios_network:
    external: true
