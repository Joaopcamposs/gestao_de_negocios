services:
  lawyer-api:
    build:
      context: ../..
      dockerfile: infra/applications/Dockerfile.service
      args:
        SERVICE_MODULE: services.lawyer.main:app
    container_name: barramento_lawyer_api
    ports:
      - "8002:8000"
    environment:
      - IN_DOCKER=true
      - DB_HOST=barramento_postgres
      - SERVICE_TYPE=lawyer
    env_file:
      - ../../.env
    networks:
      - barramento_network

networks:
  barramento_network:
    external: true
