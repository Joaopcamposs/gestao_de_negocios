services:
  dentist-api:
    build:
      context: ../..
      dockerfile: infra/applications/Dockerfile.service
      args:
        SERVICE_MODULE: services.dentist.main:app
    container_name: gestao_de_negocios_dentist_api
    ports:
      - "8001:8000"
    environment:
      - IN_DOCKER=true
      - DB_HOST=gestao_de_negocios_postgres
      - SERVICE_TYPE=dentist
    env_file:
      - ../../.env
    networks:
      - gestao_de_negocios_network

networks:
  gestao_de_negocios_network:
    external: true
